<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM News | Turbo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-surface: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        body {
            background-color: #050505;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            /* Removes 300ms tap delay on mobile devices */
            touch-action: manipulation;
        }

        /* --- AMBIENT BACKGROUND --- */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0f0f11;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
        }

        .orb-2 {
            bottom: -10%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, 50px) scale(1.1);
            }
        }

        /* --- CONTAINER --- */
        #feed-container {
            width: 100%;
            max-width: 620px;
            padding: 60px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            gap: 35px;
            z-index: 1;
        }

        /* --- HEADER --- */
        .site-header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 1.2s ease-out;
        }

        .site-title {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -3px;
            background: linear-gradient(to bottom right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.3));
        }

        .site-subtitle {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            margin-top: 5px;
            text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        /* --- CARDS (Optimized for Speed) --- */
        .card {
            display: flex;
            flex-direction: column;
            background: var(--glass-surface);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: slideUp 0.7s ease-out forwards;

            /* Normal state transition */
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(40, 40, 50, 0.75);
            cursor: pointer;
        }

        /* INSTANT FEEDBACK STATE */
        .card:active {
            /* Snaps instantly when clicked */
            transform: scale(0.98);
            transition: transform 0.05s ease-out;
            /* Super fast transition */
            filter: brightness(0.9);
        }

        .image-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #1e1e24;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
            opacity: 0.95;
        }

        .card:hover .card-img {
            transform: scale(1.08);
        }

        .content {
            padding: 28px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .source-tag {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date-tag {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 100px;
            font-weight: 500;
            backdrop-filter: blur(5px);
        }

        h2 {
            margin: 0 0 14px 0;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.5px;
            color: #fff;
        }

        p {
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 300;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #loader {
            align-self: center;
            margin-top: 50px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div id="feed-container">
        <header class="site-header">
            <h1 class="site-title">DM News</h1>
            <div class="site-subtitle">Popular AI Stories</div>
        </header>
        <div id="loader"></div>
    </div>

    <script>
        const API_KEY = '9ee1891db57d47d08d7f5001566d4f97';
        const PROXY = 'https://api.allorigins.win/raw?url=';
        const today = new Date().toISOString().split('T')[0];

        // sortBy=popularity to get the most important news
        const URL = `https://newsapi.org/v2/everything?q=AI%20OR%20"Artificial%20Intelligence"&from=2026-01-25&to=${today}&language=en&sortBy=popularity&apiKey=${API_KEY}`;

        const FALLBACK_IMG = 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?q=80&w=800&auto=format&fit=crop';

        // TURBO: Function to preconnect to the news site on hover
        function warmUpConnection(url) {
            try {
                // Extract hostname (e.g., https://cnn.com)
                const targetUrl = new URL(url);
                const origin = targetUrl.origin;

                // Check if already preconnected
                if (document.head.querySelector(`link[href="${origin}"]`)) return;

                // Inject DNS Prefetch link
                const link = document.createElement('link');
                link.rel = 'dns-prefetch'; // Resolves IP address
                link.href = origin;
                document.head.appendChild(link);

                // Inject Preconnect link
                const link2 = document.createElement('link');
                link2.rel = 'preconnect'; // Sets up handshake
                link2.href = origin;
                document.head.appendChild(link2);

                console.log(`Warming up connection to: ${origin}`);
            } catch (e) {
                // Ignore invalid URLs
            }
        }

        async function init() {
            const container = document.getElementById('feed-container');
            const loader = document.getElementById('loader');

            try {
                const req = await fetch(PROXY + encodeURIComponent(URL));
                const data = await req.json();

                if (data.status !== 'ok') throw new Error(data.message);

                loader.remove();

                if (data.articles.length === 0) {
                    container.innerHTML += `<p style="text-align:center; color:#ccc;">No news found.</p>`;
                    return;
                }

                data.articles.forEach((article, index) => {
                    if (article.title === "[Removed]") return;

                    let imgUrl = article.urlToImage || FALLBACK_IMG;

                    const dateObj = new Date(article.publishedAt);
                    const dateStr = dateObj.toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', year: 'numeric'
                    });

                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = article.url;
                    card.target = '_blank';
                    // 'noopener' is safe, 'noreferrer' sometimes slows down referrer passing but is better for privacy
                    // We keep noopener to ensure the new tab runs in a separate process (preventing UI freeze)
                    card.rel = 'noopener';
                    card.style.animationDelay = `${index * 0.1}s`;

                    // Add Turbo-Charge Listener
                    card.addEventListener('mouseenter', () => warmUpConnection(article.url), { once: true });

                    card.innerHTML = `
                        <div class="image-wrapper">
                            <img src="${imgUrl}" class="card-img" alt="News" onerror="this.src='${FALLBACK_IMG}'">
                        </div>
                        <div class="content">
                            <div class="meta-row">
                                <span class="source-tag">${article.source.name}</span>
                                <span class="date-tag">${dateStr}</span>
                            </div>
                            <h2>${article.title}</h2>
                            <p>${article.description || 'Click to read full details...'}</p>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                loader.style.display = 'none';
                container.innerHTML += `<p style="text-align:center; color:#e2e8f0;">Unable to load stream.<br><small>${error.message}</small></p>`;
            }
        }

        init();
    </script>
</body>

</html>
